<svg version="1.1" baseProfile="basic" id="svg-root" width="100%" height="100%" viewBox="0 0 480 360"
  xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<!--
SVG 1.1 2nd Edition Test Case filters-tile-01-b.  Copyright 2009 World Wide Web Consortium, (Massachusetts Institute
of Technology, European Research Consortium for Informatics and Mathematics (ERCIM), Keio University).
All Rights Reserved.  See http://www.w3.org/Consortium/Legal/.

The test case constructs a filter that uses feTile to tile the entire specified filter region.  The tile consists of a
green rectangle over a larger transparent rectangle.  The green rectangle is created with feFlood and feOffset.  There
is also a semi-transparent blue rectangle that should exactly cover one of the tiled rectangles, creating a purple
tile with a black stroke (4 tiles down and 3 across).

The rendered picture should match the reference image.  The labelling text has been removed.
-->

  <g id="test-body-content">
    <defs>
      <filter id="feTileFilter" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="115" y="40" width="250" height="250">
        <feFlood x="115" y="40" width="54" height="19" flood-color="lime"/>
        <feOffset x="115" y="40" width="50" height="25" dx="6" dy="6" result="offset"/>
        <feTile/>
      </filter>
    </defs>
    <!-- The 'g' has no content, but the filter causes a rectangle
         to be created which is filled with a tiled pattern. -->
    <g filter="url(#feTileFilter)"/>
    <!-- Show the outline of the rectangle which is filled with the tiled pattern. -->
    <rect x="115" y="40" width="250" height="250" fill="none" stroke="blue" stroke-width="2"/>
    <!-- draw a semi-transparent rectangle over one of the tiles -->
    <rect x="215" y="115" width="50" height="25" fill="blue" fill-opacity="0.5" stroke="black"/>
  </g>
  <rect id="test-frame" x="1" y="1" width="478" height="358" fill="none" stroke="#000000"/>
</svg>
