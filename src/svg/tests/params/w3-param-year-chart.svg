<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="100%" height="100%" viewBox="0 0 330 160">

  <title>Year Chart</title>
  <defs>
    <filter id="bezel" x="-40%" y="-100%" width="180%" height="250%">
			<feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
			<feOffset in="blur" dx="3" dy="-3" result="offsetBlur"/>
			<feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" 
                          specularExponent="16" lighting-color="white"  
                          result="specOut">
				<fePointLight x="-200" y="300" z="200"/>
			</feSpecularLighting>
			<feComposite in="specOut" in2="SourceAlpha" operator="in" result="specOut"/>
			<feComposite in="SourceGraphic" in2="specOut" operator="arithmetic" 
                   k1="0" k2="1" k3="1" k4="0" result="litPaint"/>
			<feMerge>
				<feMergeNode in="offsetBlur"/>
				<feMergeNode in="litPaint"/>
			</feMerge>
		</filter>
		
		<linearGradient id="tickmarks" x1="0" x2="0" y1="0" y2="1">
		  <stop offset="0" stop-color="#f1f1f1" />
		  <stop offset="0.8" stop-color="white" stop-opacity="0"/>
		</linearGradient>
  </defs>
  
  
  
  <g>
    <line id="tick-0" x1="5" y1="120" x2="20" y2="120" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="127" font-size="5" fill="black" text-anchor="end" font-family="Verdana, sans-serif">0%</text>
  </g>
  <g>
    <rect x="5" y="95" width="330" height="10" fill="url(#tickmarks)"/>
    <line id="tick-25" x1="5" y1="95" x2="20" y2="95" stroke="black" stroke-width="1" stroke-linecap="round"/>
    <text x="20" y="102" font-size="5" fill="black" text-anchor="end" font-family="Verdana, sans-serif">25%</text>
  </g>
  <g>
    <rect x="5" y="70" width="330" height="10" fill="url(#tickmarks)"/>
    <line id="tick-50" x1="5" y1="70" x2="20" y2="70" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="77" font-size="5" fill="black" text-anchor="end" font-family="Verdana, sans-serif">50%</text>
  </g>
  <g>
    <rect x="5" y="45" width="330" height="10" fill="url(#tickmarks)"/>
    <line id="tick-75" x1="5" y1="45" x2="20" y2="45" stroke="black" stroke-width="1" stroke-linecap="round"/>
    <text x="20" y="52" font-size="5" fill="black" text-anchor="end" font-family="Verdana, sans-serif">75%</text>
  </g>
  <g>
    <rect x="5" y="20" width="330" height="10" fill="url(#tickmarks)"/>
    <line id="tick-100" x1="5" y1="20" x2="20" y2="20" stroke="black" stroke-width="2" stroke-linecap="round"/>
    <text x="20" y="27" font-size="5" fill="black" text-anchor="end" font-family="Verdana, sans-serif">100%</text>
  </g>

  <g id="bars" transform="scale(1,-1)" >
    <g id="winter">
      <rect id="dec" x="300" y="-120" width="20" height="param(dec) 0" rx="5" ry="5" fill="lightsteelblue" filter="url(#bezel)" />
      <rect id="Jan" x="25" y="-120" width="20" height="param(jan) 0" rx="5" ry="5" fill="gray" filter="url(#bezel)" />
      <rect id="feb" x="50" y="-120" width="20" height="param(feb) 0" rx="5" ry="5" fill="slateblue" filter="url(#bezel)" />
    </g>
    <g id="spring">
      <rect id="march" x="75" y="-120" width="20" height="param(mar) 0" rx="5" ry="5" fill="yellow" filter="url(#bezel)" />
      <rect id="april" x="100" y="-120" width="20" height="param(apr) 0" rx="5" ry="5" fill="lime" filter="url(#bezel)" />
      <rect id="may" x="125" y="-120" width="20" height="param(may) 0" rx="5" ry="5" fill="cornflowerblue" filter="url(#bezel)" />
    </g>
    <g id="summer">
      <rect id="june" x="150" y="-120" width="20" height="param(jun) 0" rx="5" ry="5" fill="red" filter="url(#bezel)" />
      <rect id="july" x="175" y="-120" width="20" height="param(jul) 0" rx="5" ry="5" fill="green" filter="url(#bezel)" />
      <rect id="aug" x="200" y="-120" width="20" height="param(aug) 0" rx="5" ry="5" fill="blue" filter="url(#bezel)" />
    </g>
    <g id="fall">
      <rect id="sept" x="225" y="-120" width="20" height="param(sep) 0" rx="5" ry="5" fill="orange" filter="url(#bezel)" />
      <rect id="oct" x="250" y="-120" width="20" height="param(oct) 0" rx="5" ry="5" fill="brown" filter="url(#bezel)" />
      <rect id="nov" x="275" y="-120" width="20" height="param(nov) 0" rx="5" ry="5" fill="purple" filter="url(#bezel)" />
    </g>
  </g>
  
  <text x="35" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Jan<tspan font-size="5" font-weight="normal" x="35" y="136" text-anchor="middle" content-value="param(jan)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="60" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Feb<tspan font-size="5" font-weight="normal" x="60" y="136" text-anchor="middle" content-value="param(feb)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="85" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Mar<tspan font-size="5" font-weight="normal" x="85" y="136" text-anchor="middle" content-value="param(mar)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="110" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Apr<tspan font-size="5" font-weight="normal" x="110" y="136" text-anchor="middle" content-value="param(apr)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="135" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">May<tspan font-size="5" font-weight="normal" x="135" y="136" text-anchor="middle" content-value="param(may)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="160" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Jun<tspan font-size="5" font-weight="normal" x="160" y="136" text-anchor="middle" content-value="param(jun)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="185" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Jul<tspan font-size="5" font-weight="normal" x="185" y="136" text-anchor="middle" content-value="param(jul)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="210" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Aug<tspan font-size="5" font-weight="normal" x="210" y="136" text-anchor="middle" content-value="param(aug)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="235" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Sep<tspan font-size="5" font-weight="normal" x="235" y="136" text-anchor="middle" content-value="param(sep)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="260" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Oct<tspan font-size="5" font-weight="normal" x="260" y="136" text-anchor="middle" content-value="param(oct)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="285" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Nov<tspan font-size="5" font-weight="normal" x="285" y="136" text-anchor="middle" content-value="param(nov)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>
  <text x="310" y="130" font-size="7" font-weight="bold" fill="black" text-anchor="middle" font-family="Verdana, sans-serif">Dec<tspan font-size="5" font-weight="normal" x="310" y="136" text-anchor="middle" content-value="param(dec)"> </tspan><tspan font-size="5" font-weight="normal">%</tspan></text>

  <script type="text/ecmascript" xlink:href="param.js" />
</svg>