<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <title>Quilt block</title>
  <desc>A single square patchwork motif that preserves its aspect ratio and crops (slices) to cover the shape.</desc>
  <defs>
    <pattern id="pidTextilesQuiltBlock" patternUnits="objectBoundingBox" x="0" y="0" width="1" height="1"
      viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <rect width="100" height="100" fill="#f3e6c8"/>
      <path d="M0 0H50L0 50Z M100 0V50L50 0Z M0 100V50L50 100Z M100 100H50L100 50Z" fill="#3e6b8a"/>
      <path d="M50 10L90 50L50 90L10 50Z" fill="#c8553d"/>
      <rect x="35" y="35" width="30" height="30" fill="#f3e6c8"/>
      <circle cx="50" cy="50" r="8" fill="#3e6b8a"/>
    </pattern>
  </defs>
  <rect width="160" height="100" fill="url(#pidTextilesQuiltBlock)"/>
</svg>
