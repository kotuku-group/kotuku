  <title>RedPlaid</title>
  <desc>A simple repeating red plaid with black bands split by a white line, woven in a 2/2 twill so that the
    colours mix wherever the warp and weft differ.</desc>
  <defs>
    <clipPath id="clipTextilesRedPlaidTwill">
      <path d="
        M-50,0h1l50,50h-1ZM-48,0h1l50,50h-1ZM-46,0h1l50,50h-1ZM-44,0h1l50,50h-1ZM-42,0h1l50,50h-1ZM-40,0h1l50,50h-1Z
        M-38,0h1l50,50h-1ZM-36,0h1l50,50h-1ZM-34,0h1l50,50h-1ZM-32,0h1l50,50h-1ZM-30,0h1l50,50h-1ZM-28,0h1l50,50h-1Z
        M-26,0h1l50,50h-1ZM-24,0h1l50,50h-1ZM-22,0h1l50,50h-1ZM-20,0h1l50,50h-1ZM-18,0h1l50,50h-1ZM-16,0h1l50,50h-1Z
        M-14,0h1l50,50h-1ZM-12,0h1l50,50h-1ZM-10,0h1l50,50h-1ZM-8,0h1l50,50h-1ZM-6,0h1l50,50h-1ZM-4,0h1l50,50h-1Z
        M-2,0h1l50,50h-1ZM0,0h1l50,50h-1ZM2,0h1l50,50h-1ZM4,0h1l50,50h-1ZM6,0h1l50,50h-1ZM8,0h1l50,50h-1Z
        M10,0h1l50,50h-1ZM12,0h1l50,50h-1ZM14,0h1l50,50h-1ZM16,0h1l50,50h-1ZM18,0h1l50,50h-1ZM20,0h1l50,50h-1Z
        M22,0h1l50,50h-1ZM24,0h1l50,50h-1ZM26,0h1l50,50h-1ZM28,0h1l50,50h-1ZM30,0h1l50,50h-1ZM32,0h1l50,50h-1Z
        M34,0h1l50,50h-1ZM36,0h1l50,50h-1ZM38,0h1l50,50h-1ZM40,0h1l50,50h-1ZM42,0h1l50,50h-1ZM44,0h1l50,50h-1Z
        M46,0h1l50,50h-1ZM48,0h1l50,50h-1Z"/>
    </clipPath>
    <pattern id="pidTextilesRedPlaid" patternUnits="userSpaceOnUse" width="100" height="100" viewBox="0 0 50 50">
      <rect width="50" height="50" fill="#b32633"/>
      <!-- Warp -->
      <path fill="#1f0c0d" d="M28,0h10v50h-10Z M40,0h10v50h-10Z"/>
      <path fill="#faf8f2" d="M38,0h2v50h-2Z"/>
      <!-- Weft, woven through the warp -->
      <g clip-path="url(#clipTextilesRedPlaidTwill)">
        <path fill="#b32633" d="M0,0h50v28h-50Z"/>
        <path fill="#1f0c0d" d="M0,28h50v10h-50Z M0,40h50v10h-50Z"/>
        <path fill="#faf8f2" d="M0,38h50v2h-50Z"/>
      </g>
    </pattern>
  </defs>
  <rect width="376" height="376" fill="url(#pidTextilesRedPlaid)"/>
</svg>
