<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <title>Chrome</title>
  <desc>Reflective horizontal bands that stretch to fill the bounds of the shape, ignoring its aspect ratio.</desc>
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7fa"/>
      <stop offset="0.45" stop-color="#9aa4ae"/>
      <stop offset="0.5" stop-color="#4c555e"/>
      <stop offset="0.75" stop-color="#c3cad1"/>
      <stop offset="1" stop-color="#7d8790"/>
    </linearGradient>
    <pattern id="pidMetalsChrome" patternUnits="objectBoundingBox" x="0" y="0" width="1" height="1"
      viewBox="0 0 100 100" preserveAspectRatio="none">
      <rect width="100" height="100" fill="url(#shine)"/>
      <path d="M0 18 C30 12 70 24 100 16 L100 22 C70 30 30 18 0 24 Z" fill="#ffffff" fill-opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="160" height="100" fill="url(#pidMetalsChrome)"/>
</svg>
