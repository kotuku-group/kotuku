  <title>Sunset</title>
  <desc>A native vertical linear gradient from deep violet through orange to pale gold.</desc>
  <defs>
    <linearGradient id="pidGradientsSunset" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d1b4e"/>
      <stop offset="0.45" stop-color="#b8405e"/>
      <stop offset="0.75" stop-color="#f08a3c"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
  </defs>
  <rect width="160" height="100" fill="url(#pidGradientsSunset)"/>
</svg>
