  <title>Zzap!</title>
  <desc></desc>
  <defs>
    <pattern id="pidGeometricZzap" patternUnits="userSpaceOnUse" width="128" height="184"
      viewBox="0 0 128 184">
      <rect width="128" height="184" fill="red"/>

      <kotuku:wave fill="yellow" thickness="16" type="sawtooth" stroke="black" frequency="16" stroke-width="4"
        x="-16" y="40" length="160" amplitude="32" stroke-linejoin="miter" stroke-linecap="miter"/>

      <kotuku:wave fill="orange" thickness="16" type="sawtooth" stroke="black" frequency="16" stroke-width="4"
        x="-24" y="132" length="192" amplitude="32" stroke-linejoin="miter" stroke-linecap="miter"/>
    </pattern>
