        M32,66Q39.2,88.8 62,96Q39.2,103.2 32,126Q24.8,103.2 2,96Q24.8,88.8 32,66Z
        M32,72Q27.2,91.2 8,96Q27.2,100.8 32,120Q36.8,100.8 56,96Q36.8,91.2 32,72Z
