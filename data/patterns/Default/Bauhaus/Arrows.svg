  <title>Bauhaus arrows</title>
  <desc>Sawtooth rows of arrowheads in sand, rust, taupe and grey, offset from row to row, after
    the jacquard designs of the Bauhaus weaving workshop.</desc>
  <defs>
    <pattern id="pidBauhausArrows" patternUnits="userSpaceOnUse" width="96" height="96"
      viewBox="0 0 96 96">
      <rect width="96" height="96" fill="#d9cdb3"/>
      <!-- Row grounds -->
      <path fill="#d4b4a2" d="M0,0h96v32h-96Z"/>
      <path fill="#d9cdb3" d="M0,32h96v32h-96Z"/>
      <path fill="#8e8f8a" d="M0,64h96v32h-96Z"/>
      <!-- Arrowheads -->
      <path fill="#ab6a4f" d="
        M-16,3L0,16L-16,29ZM0,3L16,16L0,29ZM16,3L32,16L16,29ZM32,3L48,16L32,29ZM48,3L64,16L48,29ZM64,3L80,16L64,29Z
        M80,3L96,16L80,29Z"/>
      <path fill="#a39182" d="
        M-8,35L8,48L-8,61ZM8,35L24,48L8,61ZM24,35L40,48L24,61ZM40,35L56,48L40,61ZM56,35L72,48L56,61Z
        M72,35L88,48L72,61ZM88,35L104,48L88,61Z"/>
      <path fill="#d4b4a2" d="
        M-16,67L0,80L-16,93ZM0,67L16,80L0,93ZM16,67L32,80L16,93ZM32,67L48,80L32,93ZM48,67L64,80L48,93Z
        M64,67L80,80L64,93ZM80,67L96,80L80,93Z"/>
      <!-- Dividing threads -->
      <path fill="#6b5547" d="M0,0h96v1h-96ZM0,31h96v2h-96ZM0,63h96v2h-96ZM0,95h96v1h-96Z"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pidBauhausArrows)"/>
</svg>
