  <title>Bauhaus blocks</title>
  <desc>A repeating grid of quarter circles, half discs, targets, triangles and bars in muted Bauhaus red,
    mustard, slate blue and charcoal on cream.  Parameters: chroma, a multiplier of the colour intensity, where
    1 is the original level and 0 is greyscale.</desc>
