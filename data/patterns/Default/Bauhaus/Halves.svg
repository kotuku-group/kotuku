  <title>Bauhaus halves</title>
  <desc>Discs split into two coloured halves, turning a quarter turn from tile to tile on a chequer of cream and
    paper.  Parameters: chroma, a multiplier of the colour intensity, where 1 is the original level and 0 is
    greyscale.</desc>
  <defs>
    <filter id="fltBauhausHalvesChroma" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="param(chroma) 1"/>
    </filter>
    <pattern id="pidBauhausHalves" patternUnits="userSpaceOnUse" width="128" height="128"
      viewBox="0 0 128 128">
      <g filter="url(#fltBauhausHalvesChroma)">
        <rect width="128" height="128" fill="#e8dfcb"/>
        <!-- Chequered ground -->
        <path fill="#e8dfcb" d="
          M0,0h32v32h-32ZM64,0h32v32h-32ZM32,32h32v32h-32ZM96,32h32v32h-32ZM0,64h32v32h-32ZM64,64h32v32h-32Z
          M32,96h32v32h-32ZM96,96h32v32h-32Z"/>
        <path fill="#d9cdb3" d="
          M32,0h32v32h-32ZM96,0h32v32h-32ZM0,32h32v32h-32ZM64,32h32v32h-32ZM32,64h32v32h-32ZM96,64h32v32h-32Z
          M0,96h32v32h-32ZM64,96h32v32h-32Z"/>
        <!-- Split discs -->
        <path fill="#b25841" d="
          M16,3A13,13 0 0,1 16,29ZM125,16A13,13 0 0,1 99,16ZM48,35A13,13 0 0,1 48,61ZM67,48A13,13 0 0,1 93,48Z
          M16,93A13,13 0 0,1 16,67ZM99,80A13,13 0 0,1 125,80ZM48,125A13,13 0 0,1 48,99ZM93,112A13,13 0 0,1 67,112Z"/>
        <path fill="#45607e" d="
          M16,29A13,13 0 0,1 16,3ZM80,29A13,13 0 0,1 80,3ZM29,48A13,13 0 0,1 3,48ZM93,48A13,13 0 0,1 67,48Z
          M16,67A13,13 0 0,1 16,93ZM80,67A13,13 0 0,1 80,93ZM3,112A13,13 0 0,1 29,112ZM67,112A13,13 0 0,1 93,112Z"/>
        <path fill="#cfa24c" d="
          M61,16A13,13 0 0,1 35,16ZM80,3A13,13 0 0,1 80,29ZM3,48A13,13 0 0,1 29,48ZM112,35A13,13 0 0,1 112,61Z
          M35,80A13,13 0 0,1 61,80ZM80,93A13,13 0 0,1 80,67ZM29,112A13,13 0 0,1 3,112ZM112,125A13,13 0 0,1 112,99Z"/>
        <path fill="#2f2e2c" d="
          M35,16A13,13 0 0,1 61,16ZM99,16A13,13 0 0,1 125,16ZM48,61A13,13 0 0,1 48,35ZM112,61A13,13 0 0,1 112,35Z
          M61,80A13,13 0 0,1 35,80ZM125,80A13,13 0 0,1 99,80ZM48,99A13,13 0 0,1 48,125ZM112,99A13,13 0 0,1 112,125Z"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pidBauhausHalves)"/>
</svg>
