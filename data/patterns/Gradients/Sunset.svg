<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <!-- Created in 2026 by Paul Manias.  Freely distributable under the deed of CC0 1.0 Universal -->
  <title>Sunset</title>
  <desc>A native vertical linear gradient from deep violet through orange to pale gold.
    Parameters: shadow, baseColour, accent, highlight.</desc>
  <defs>
    <linearGradient id="pidGradientsSunset" gradientUnits="objectBoundingBox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="param(shadow) #2d1b4e"/>
      <stop offset="0.45" stop-color="param(baseColour) #b8405e"/>
      <stop offset="0.75" stop-color="param(accent) #f08a3c"/>
      <stop offset="1" stop-color="param(highlight) #ffd98a"/>
    </linearGradient>
  </defs>
  <rect width="160" height="100" fill="url(#pidGradientsSunset)"/>
</svg>
