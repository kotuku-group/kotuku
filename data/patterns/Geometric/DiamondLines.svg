  <title>Diamond lines</title>
  <desc>Fine charcoal lines trace nested diamonds in a continuous diagonal lattice.</desc>
  <defs>
    <pattern id="pidGeometricDiamondLines" patternUnits="userSpaceOnUse" width="64" height="64"
      viewBox="0 0 128 128">
      <rect width="128" height="128" fill="param(bkgd) #eeeeea"/>
      <path fill="none" stroke="param(fore) #222627" stroke-width="3" d="
        M0,-16L16,0L0,16L-16,0Z
        M0,-32L32,0L0,32L-32,0Z
        M0,-48L48,0L0,48L-48,0Z
        M0,-64L64,0L0,64L-64,0Z
        M0,112L16,128L0,144L-16,128Z
        M0,96L32,128L0,160L-32,128Z
        M0,80L48,128L0,176L-48,128Z
        M0,64L64,128L0,192L-64,128Z
        M64,48L80,64L64,80L48,64Z
        M64,32L96,64L64,96L32,64Z
        M64,16L112,64L64,112L16,64Z
        M64,0L128,64L64,128L0,64Z
        M128,-16L144,0L128,16L112,0Z
        M128,-32L160,0L128,32L96,0Z
        M128,-48L176,0L128,48L80,0Z
        M128,-64L192,0L128,64L64,0Z
        M128,112L144,128L128,144L112,128Z
        M128,96L160,128L128,160L96,128Z
        M128,80L176,128L128,176L80,128Z
        M128,64L192,128L128,192L64,128Z"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pidGeometricDiamondLines)"/>
</svg>
