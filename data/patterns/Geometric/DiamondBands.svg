<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Created in 2026 by Paul Manias.  Freely distributable under the deed of CC0 1.0 Universal -->
  <title>Diamond Bands</title>
  <desc>Broad black, grey and chalk bands form a repeating field of nested diamonds.</desc>
  <defs>
    <!-- One set of nested square diamonds, centred on the origin -->
    <symbol id="geoDiamondBandsSet" overflow="visible">
      <path fill="param(shade) #17191a" d="M0,-180L180,0L0,180L-180,0Z"/>
      <path fill="param(mid) #929392" d="M0,-150L150,0L0,150L-150,0Z"/>
      <path fill="param(fore) #f1f0ed" d="M0,-120L120,0L0,120L-120,0Z"/>
      <path fill="param(shade) #17191a" d="M0,-90L90,0L0,90L-90,0Z"/>
      <path fill="param(mid) #929392" d="M0,-60L60,0L0,60L-60,0Z"/>
      <path fill="param(fore) #f1f0ed" d="M0,-30L30,0L0,30L-30,0Z"/>
      <path fill="param(shade) #17191a" d="M0,-12L12,0L0,12L-12,0Z"/>
    </symbol>
    <!-- Sets sit at the corners and centre of the cell, so neighbouring outer bands meet edge to edge -->
    <pattern id="pidGeometricDiamondBands" patternUnits="userSpaceOnUse" width="90" height="90"
      viewBox="0 0 360 360">
      <rect width="360" height="360" fill="param(shade) #17191a"/>
      <use href="#geoDiamondBandsSet"/>
      <use href="#geoDiamondBandsSet" x="360"/>
      <use href="#geoDiamondBandsSet" x="180" y="180"/>
      <use href="#geoDiamondBandsSet" y="360"/>
      <use href="#geoDiamondBandsSet" x="360" y="360"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pidGeometricDiamondBands)"/>
</svg>
