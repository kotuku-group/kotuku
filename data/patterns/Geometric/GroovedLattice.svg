  <title>Grooved lattice (centred)</title>
  <desc>Grey concrete covered in fine diagonal grooves that turn at the centre lines, meeting in chevrons that
    trace a large cross.  The square design is centred and scaled to cover the bounds of the shape, clipping any
    overflow rather than tiling.</desc>

