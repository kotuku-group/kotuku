  <title>Bauhaus triangles</title>
  <desc>Half-square and quarter triangles in charcoal, brick red, slate blue and mustard on cream, with a few
    larger triangles spanning four cells.  Parameters: chroma, a multiplier of the colour intensity, where 1 is
    the original level and 0 is greyscale.</desc>
  <defs>
    <filter id="fltBauhausTrianglesChroma" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="param(chroma) 1"/>
    </filter>
    <pattern id="pidBauhausTriangles" patternUnits="userSpaceOnUse" width="320" height="320"
      viewBox="0 0 320 320">
      <g filter="url(#fltBauhausTrianglesChroma)">
        <rect width="100%" height="100%" fill="#fff6e4"/>
        <!-- Original quarter: the first 25 cells -->
        <path fill="#2f2e2c" d="
          M64,0L64,64L0,64ZM128,32L96,32L96,0ZM64,32L96,32L96,64ZM32,96L32,128L16,112ZM128,160L96,160L112,144Z"/>
        <path fill="#b25841" d="
          M160,128L96,128L96,64ZM160,0L160,32L128,32ZM0,64L32,64L16,80ZM32,160L0,160L16,144ZM32,160L32,128L48,144Z
          M160,128L160,160L128,160Z"/>
        <path fill="#45607e" d="M32,64L96,64L96,128ZM96,64L96,32L112,48Z"/>
        <path fill="#cfa24c" d="
          M96,32L64,32L64,0ZM128,32L128,64L112,48ZM0,128L0,96L16,112ZM64,128L64,160L48,144ZM96,128L128,128L112,144Z"/>
        <!-- Remaining 75 cells -->
        <path fill="#2f2e2c" d="
          M224,32L224,96L160,96ZM288,0L320,32L288,32ZM320,96L288,96L304,80ZM224,96L256,128L224,128Z
          M160,128L192,160L160,160ZM256,128L288,160L256,160ZM32,192L32,160L48,176ZM96,192L96,224L80,208Z
          M160,192L192,192L176,208ZM192,192L192,224L176,208ZM224,224L224,192L240,208ZM224,224L224,256L192,256Z
          M128,288L160,288L128,320Z"/>
        <path fill="#b25841" d="
          M224,224L288,224L288,288ZM96,160L160,160L160,224ZM192,128L256,192L192,192ZM64,256L128,320L64,320Z
          M160,0L192,0L160,32ZM160,96L192,96L176,112ZM320,128L288,128L304,112ZM320,96L320,128L304,112Z
          M0,192L32,192L0,224ZM288,288L320,288L304,304Z"/>
        <path fill="#45607e" d="
          M128,224L192,288L128,288ZM288,32L288,96L224,96ZM224,0L224,32L208,16ZM192,96L224,128L192,128Z
          M288,128L320,128L304,144ZM288,160L288,128L304,144ZM0,192L0,160L16,176ZM32,192L0,192L16,176Z
          M64,192L64,160L80,176ZM64,192L64,224L48,208ZM32,224L32,192L48,208ZM224,192L256,192L240,208Z
          M96,224L96,256L80,240ZM64,256L64,224L80,240ZM320,256L288,256L304,240Z"/>
        <path fill="#cfa24c" d="
          M0,224L64,224L64,288ZM256,160L320,160L320,224ZM192,32L192,0L208,16ZM256,0L288,0L256,32Z
          M320,32L320,64L304,48ZM192,96L192,128L176,112ZM256,96L288,96L256,128ZM96,192L64,192L80,176Z
          M192,160L192,192L160,192ZM224,192L224,224L208,208ZM224,256L224,288L208,272ZM192,320L160,320L176,304Z
          M224,288L256,288L256,320ZM320,288L320,320L304,304Z"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#pidBauhausTriangles)"/>
</svg>
