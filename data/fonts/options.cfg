# Font options in this file will add/overwrite values in fonts.cfg, which is machine generated.
# The fonts.cfg file can be refreshed by deleting it, then running any program that uses the Kotuku UI.
#
# Hinting options for scalable fonts are as follows.  Please pay close attention to kerning results when adjusting the
# hinting of a font.  Hinting matters most for small font sizes, improving sharpness and the rendering of small accents.
# It works by aligning paths to the pixel grid.
#
#  Normal:   The hinting information provided by the font should be given preference.
#  Internal: The Freetype hinter should be used and font specific hinting can be ignored (generally not recommended).
#  Light:    The light version of the Freetype hinter should be used (apply internal hinting on the Y axis only).
#
# Automatic kerning can be disabled by setting the Kerning option to No.
#
# Sizes below 14px are always grid fitted (fonts without hinting receive the light hinter).  Setting the Embolden
# option widens thin stems at these sizes.  The strength is given in pixels as X[, Y], applying in full at 8px and
# below and tapering to zero at 14px.  A missing Y is a third of X; 0.3 is a reasonable starting value.  Emboldening
# is off unless this option is set.
#
# If the vertical spacing of a font is inadequate, you can adjust it by setting LineSpacing with a multiplier value.

